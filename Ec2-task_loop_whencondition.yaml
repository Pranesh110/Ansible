 #now do auto shutdown for ubuntu instance only

---
- hosts: "ubuntu"
  become: true

  tasks:
    - name: "shutdown ubuntu only"
      ansible.builtin.command: /sbin/shutdown -t now #this will do shutdown of the machine
# now if wwe do this all the machine will shutdown now to shutdown only ubuntu we use WHEN condition
      when:
       ansible.facts['os.family']== "Debian"

#whats this ansible facts it is when we do run the plabook first thing ansible do is Gathering facts of that ini machine it whates os .
#gather facte collects: OS 


---
- name: Auto shutdown playbook
  hosts: linux
  become: true
  gather_facts: true

  tasks:
    - name: Print gather facts
      ansible.builtin.debug:   
        var: ansible_facts  #this prints what and all the gather facts collect from machines

    - name: Shutdown the server
      ansible.builtin.command: /sbin/shutdown -h now
      When:
       ansible.facts['os_fmaily']== "Debian"


- name: Auto shutdown playbook
  hosts: all
  become: true
  gather_facts: true

  tasks:
