   - ami-01a00762f46d584a1 #ubuntu
#but this will create two machine only as ansible wont create a same config machine another time

#to avoid this we diff it with name

#so in loop we have both image id and specific name to create and call that loop value using item.name item.image

- name: "start an instance with a public IP address"
  amazon.aws.ec2_instance:
      name: "{{item.name}}"
      key_name: "{{key}}"
      vpc_subnet_id: subnet-0fd2c841764ba6d5d
      instance_type: "{{type}}"
      security_group: "{{sg}}"
      network_interfaces:
       - assign_public_ip: true
      image_id: "{{item.image}}" #to call the loop value but use only item word if that values is for only on var lik here is imageid
      region: "{{mumbai}}"
      aws_access_key: "{{access_key}}"
      aws_secret_key: "{{screat_key}}"
# We would be needing three machine now we use LOOPING use -loop 
      loop:
       - { image: "{{amazonlinux}}", name: "amazonlinux_machine" }
       - { image: "{{ubuntu}}", name: "ubuntu1" }
       - { image: "{{ubuntu}}", name: "ubuntu2" }

# now create a playbook
---
 - name: "ec2"
   hosts: localhost
   connection: local
   roles:
    - ec2_creation
